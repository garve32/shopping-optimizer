<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 옵티마이저</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --soft: #f0f4f8;
      --line: #d7dee7;
      --text: #17202e;
      --muted: #667386;
      --blue: #2367d1;
      --blue-soft: #e8f0ff;
      --green: #12805c;
      --green-soft: #e6f5ef;
      --amber: #9a6700;
      --amber-soft: #fff3d8;
      --shadow: 0 10px 28px rgba(30, 41, 59, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
              "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI",
              Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    input,
    button {
      font: inherit;
    }

    .app {
      width: min(430px, 100%);
      margin: 0 auto;
      padding: 6px 8px 18px;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .reset {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .layout {
      display: grid;
      gap: 8px;
    }

    .inputs {
      display: grid;
      gap: 8px;
    }

    .section-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: var(--blue);
    }

    .dot.green {
      background: var(--green);
    }

    .badge,
    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .badge.good,
    .tag.green {
      background: var(--green-soft);
      color: var(--green);
    }

    .badge.neutral {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .tag {
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--muted);
    }

    .compact-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .compact-row.naver {
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.82fr);
    }

    .compact-row.gmarket {
      grid-template-columns: minmax(0, 1fr) 86px;
    }

    .compact-row.card {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .compact-row.card label {
      font-size: 11px;
    }

    .compact-row.card .money::before {
      left: 8px;
    }

    .compact-row.card input {
      padding-left: 24px;
      padding-right: 4px;
    }

    .field {
      display: grid;
      gap: 4px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .money,
    .percent {
      position: relative;
    }

    .money::before,
    .percent::after {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      font-weight: 950;
      pointer-events: none;
    }

    .money::before {
      content: "₩";
      left: 11px;
    }

    .percent::after {
      content: "%";
      right: 11px;
    }

    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
      font-size: 16px;
      font-weight: 850;
      outline: none;
    }

    .money input {
      padding-left: 29px;
    }

    .percent input {
      padding-right: 29px;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(35, 103, 209, 0.13);
    }

    input::placeholder {
      color: #a8b2c1;
      font-weight: 650;
      opacity: 1;
    }

    .result .badge {
      min-height: 26px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .compare {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 6px;
    }

    .price-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 8px;
      background: #fff;
    }

    .price-card.best {
      border-color: var(--green);
      background: var(--green-soft);
      box-shadow: 0 0 0 2px rgba(18, 128, 92, 0.12);
    }

    .price-card.best .price-label,
    .price-card.best .price {
      color: var(--green);
    }

    .price-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.2;
    }

    .price {
      margin-top: 2px;
      font-size: 18px;
      line-height: 1.12;
      font-weight: 950;
    }

    .formula {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-all;
    }

    .metric-grid {
      display: grid;
      gap: 6px;
      margin-top: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
      align-items: center;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 7px;
      background: #fff;
    }

    .row span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      line-height: 1.2;
    }

    .row strong {
      text-align: left;
      font-size: 13px;
    }

    .metric-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .metric-grid .row {
      align-content: start;
    }
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>쇼핑 옵티마이저</h1>
    <button class="reset" id="resetButton" type="button">초기화</button>
  </header>

  <div class="layout">
    <aside class="result" aria-label="결과">
      <div class="badge" id="winnerBadge">가격 입력 필요</div>

      <div class="compare">
        <article class="price-card" id="naverCard">
          <span class="price-label">네이버 실질가</span>
          <div class="price" id="naverNet">₩0</div>
          <div class="formula" id="naverFormula">
            상품금액 ₩0 - 적립 ₩0 - 카드피킹 ₩0
          </div>
        </article>

        <article class="price-card" id="gmarketCard">
          <span class="price-label">지마켓 할인 적용가</span>
          <div class="price" id="gmarketNet">₩0</div>
          <div class="formula" id="gmarketFormula">
            상품금액 ₩0 - 즉시할인 ₩0
          </div>
        </article>
      </div>

    </aside>

    <section class="inputs" aria-label="입력">
      <section class="section-card">
        <div class="section-head">
          <h2 class="section-title"><span class="dot"></span>네이버</h2>
          <span class="tag green">실적 인정</span>
        </div>
        <div class="compact-row naver">
          <div class="field">
            <label for="naverPrice">상품금액</label>
            <div class="money">
              <input
                      id="naverPrice"
                      data-money
                      type="text"
                      inputmode="numeric"
                      autocomplete="off"
                      placeholder="예: 17,700"
              />
            </div>
          </div>

          <div class="field">
            <label for="naverPoint">적립포인트</label>
            <div class="money">
              <input
                      id="naverPoint"
                      data-money
                      type="text"
                      inputmode="numeric"
                      autocomplete="off"
                      value="0"
              />
            </div>
          </div>
        </div>
      </section>

      <section class="section-card">
        <div class="section-head">
          <h2 class="section-title"><span class="dot"></span>지마켓</h2>
          <span class="tag">실적 제외</span>
        </div>
        <div class="compact-row gmarket">
          <div class="field">
            <label for="gmarketPrice">상품금액</label>
            <div class="money">
              <input
                      id="gmarketPrice"
                      data-money
                      type="text"
                      inputmode="numeric"
                      autocomplete="off"
                      placeholder="예: 14,500"
              />
            </div>
          </div>

          <div class="field">
            <label for="gmarketDiscount">할인율</label>
            <div class="percent">
              <input
                      id="gmarketDiscount"
                      data-percent
                      type="text"
                      inputmode="decimal"
                      autocomplete="off"
                      value="10"
              />
            </div>
          </div>
        </div>
      </section>

      <section class="section-card">
        <div class="section-head">
          <h2 class="section-title"><span class="dot green"></span>카드</h2>
        </div>
        <div class="compact-row card">
          <div class="field">
            <label for="cardTarget">실적 기준</label>
            <div class="money">
              <input
                      id="cardTarget"
                      data-money
                      type="text"
                      inputmode="numeric"
                      autocomplete="off"
                      value="300,000"
              />
            </div>
          </div>

          <div class="field">
            <label for="cardRefund">환급액</label>
            <div class="money">
              <input
                      id="cardRefund"
                      data-money
                      type="text"
                      inputmode="numeric"
                      autocomplete="off"
                      value="12,000"
              />
            </div>
          </div>

          <div class="field">
            <label for="currentSpend">현재 실적</label>
            <div class="money">
              <input
                      id="currentSpend"
                      data-money
                      type="text"
                      inputmode="numeric"
                      autocomplete="off"
                      value="0"
              />
            </div>
          </div>
        </div>

        <div class="metric-grid">
          <div class="row">
            <span>피킹률</span>
            <strong id="pickingRate">4%</strong>
          </div>
          <div class="row">
            <span>반영 실적</span>
            <strong id="performanceStatus">₩0</strong>
          </div>
          <div class="row">
            <span>카드피킹</span>
            <strong id="cardValue">₩0</strong>
          </div>
        </div>
      </section>
    </section>

  </div>
</main>

<script>
  const STORAGE_KEY = "shopping-effective-price:v2";
  const ids = [
    "naverPrice",
    "naverPoint",
    "gmarketPrice",
    "gmarketDiscount",
    "cardTarget",
    "cardRefund",
    "currentSpend",
  ];

  const els = Object.fromEntries(
          [
            ...ids,
            "resetButton",
            "pickingRate",
            "performanceStatus",
            "cardValue",
            "winnerBadge",
            "naverCard",
            "gmarketCard",
            "naverNet",
            "naverFormula",
            "gmarketNet",
            "gmarketFormula",
          ].map((id) => [id, document.getElementById(id)]),
  );

  const won = new Intl.NumberFormat("ko-KR", {
    style: "currency",
    currency: "KRW",
    maximumFractionDigits: 0,
  });

  function parseMoney(value) {
    const number = Number(String(value).replace(/[^\d.-]/g, ""));
    return Number.isFinite(number) ? Math.max(0, number) : 0;
  }

  function parsePercent(value) {
    const number = Number(String(value).replace(/[^\d.-]/g, ""));
    if (!Number.isFinite(number)) return 0;
    return Math.min(100, Math.max(0, number));
  }

  function formatWon(value) {
    return won.format(Math.round(value || 0));
  }

  function formatRate(value) {
    if (!Number.isFinite(value) || value <= 0) return "0%";
    return `${value.toFixed(value >= 10 ? 1 : 2)}%`;
  }

  function readValues() {
    const naverPrice = parseMoney(els.naverPrice.value);
    const naverPoint = Math.min(parseMoney(els.naverPoint.value), naverPrice);
    const gmarketPrice = parseMoney(els.gmarketPrice.value);
    const gmarketDiscountRate = parsePercent(els.gmarketDiscount.value);
    const cardTarget = parseMoney(els.cardTarget.value);
    const cardRefund = parseMoney(els.cardRefund.value);
    const currentSpend = Math.min(
            parseMoney(els.currentSpend.value),
            cardTarget || Number.POSITIVE_INFINITY,
    );
    const remainingTarget = Math.max(0, cardTarget - currentSpend);
    const pickingRate = cardTarget > 0 ? cardRefund / cardTarget : 0;
    const performanceBase = Math.min(naverPrice, remainingTarget);
    const cardValue = performanceBase * pickingRate;
    const naverNet = Math.max(0, naverPrice - naverPoint - cardValue);
    const gmarketDiscountAmount = gmarketPrice * (gmarketDiscountRate / 100);
    const gmarketNet = Math.max(0, gmarketPrice - gmarketDiscountAmount);

    return {
      naverPrice,
      naverPoint,
      gmarketPrice,
      gmarketDiscountRate,
      pickingRate,
      performanceBase,
      cardValue,
      naverNet,
      gmarketDiscountAmount,
      gmarketNet,
      hasPrices: naverPrice > 0 && gmarketPrice > 0,
    };
  }

  function render() {
    const data = readValues();
    const diff = data.naverNet - data.gmarketNet;

    els.pickingRate.textContent = formatRate(data.pickingRate * 100);
    els.performanceStatus.textContent = formatWon(data.performanceBase);
    els.cardValue.textContent = formatWon(data.cardValue);
    els.naverNet.textContent = formatWon(data.naverNet);
    els.naverFormula.textContent = `상품금액 ${formatWon(
            data.naverPrice,
    )} - 적립 ${formatWon(data.naverPoint)} - 카드피킹 ${formatWon(
            data.cardValue,
    )}`;
    els.gmarketNet.textContent = formatWon(data.gmarketNet);
    els.gmarketFormula.textContent = `상품금액 ${formatWon(
            data.gmarketPrice,
    )} - 즉시할인 ${formatWon(data.gmarketDiscountAmount)} (${formatRate(
            data.gmarketDiscountRate,
    )})`;
    els.winnerBadge.className = "badge";
    els.naverCard.classList.remove("best");
    els.gmarketCard.classList.remove("best");

    if (!data.hasPrices) {
      els.winnerBadge.textContent = "가격 입력 필요";
      save();
      return;
    }

    if (diff < 0) {
      els.winnerBadge.classList.add("good");
      els.winnerBadge.textContent = `네이버가 ${formatWon(Math.abs(diff))} 이득`;
      els.naverCard.classList.add("best");
    } else if (diff > 0) {
      els.winnerBadge.classList.add("good");
      els.winnerBadge.textContent = `지마켓이 ${formatWon(diff)} 이득`;
      els.gmarketCard.classList.add("best");
    } else {
      els.winnerBadge.classList.add("neutral");
      els.winnerBadge.textContent = "실질가 동일";
    }

    save();
  }

  function normalizeMoney(input) {
    if (input.value.trim() === "") return;
    input.value = parseMoney(input.value).toLocaleString("ko-KR");
  }

  function normalizePercent(input) {
    input.value =
            input.value.trim() === "" ? "10" : String(parsePercent(input.value));
  }

  function save() {
    const values = Object.fromEntries(ids.map((id) => [id, els[id].value]));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
  }

  function restore() {
    try {
      const values = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (!values) return;
      ids.forEach((id) => {
        if (typeof values[id] === "string") els[id].value = values[id];
      });
    } catch {
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  document.querySelectorAll("input").forEach((input) => {
    input.addEventListener("input", render);
  });

  document.querySelectorAll("[data-money]").forEach((input) => {
    input.addEventListener("blur", () => {
      normalizeMoney(input);
      render();
    });
  });

  document.querySelectorAll("[data-percent]").forEach((input) => {
    input.addEventListener("blur", () => {
      normalizePercent(input);
      render();
    });
  });

  els.resetButton.addEventListener("click", () => {
    localStorage.removeItem(STORAGE_KEY);
    els.naverPrice.value = "";
    els.naverPoint.value = "0";
    els.gmarketPrice.value = "";
    els.gmarketDiscount.value = "10";
    els.cardTarget.value = "300,000";
    els.cardRefund.value = "12,000";
    els.currentSpend.value = "0";
    render();
  });

  restore();
  render();
</script>
</body>
</html>
